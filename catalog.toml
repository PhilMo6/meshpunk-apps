# ── LoRa protocols (protocol packages) ───────────────────────────────────────
# Listed in the App Library's pinned "LoRa Protocols" category like apps.
# Installed to <drive>/meshpunk/lora_protos/<id>/ — internal flash
# (recommended: loads even without the card) or the SD card, the user's
# choice; the boot loader searches internal first, then the mounted card,
# and a card-hosted package with no card at boot means radio off + notice.
# A package may ship *.bleproto.elf files alongside its .loraproto.elf; the
# App Library moves those into L:/meshpunk/ble_protos/<filename minus
# suffix>/ (always internal) after install/update.
# `apps` = the protocol's primary apps (catalog ids), offered for download
# right after the protocol installs. Activation stays explicit in
# Settings > Lora; updates load at reboot.

[[protocols]]
id = "meshcore"
name = "MeshCore"
author = "PhilMo6"
version = "1.0.0"
type = "elf"
description = "MeshCore LoRa protocol + phone-app companion BLE protocol"
min_fw = 12
files = ["meshcore.loraproto.elf", "meshcore_companion.bleproto.elf"]
apps = ["meshcore_messenger", "meshcore_radio", "meshcore_notifications", "meshcore_identity"]

[[protocols]]
id = "mtlite"
name = "MTLite"
author = "PhilMo6"
version = "1.0.0"
type = "elf"
description = "Meshtastic-compatible LoRa protocol (leaf role)"
min_fw = 12
files = ["mtlite.loraproto.elf"]
apps = ["mtlite_messenger", "mtlite_radio", "mtlite_notifications", "mtlite_identity"]

