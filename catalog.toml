# Meshpunk App Library catalog — the single source of truth.
# An app/theme only appears on devices when it has an entry here; files in the
# repo without a catalog entry are invisible. See README.md for the field
# reference.
#
# `id` is the repo folder (download path) AND the device-side registry
# identity (written into the installed .version as an `id=` line). `name` is
# the on-device install folder + display label — it may repeat across
# categories (each protocol category has its own "Radio"). For apps that
# ship preinstalled in firmware, `name` (and category) MUST match the
# firmware folder exactly (case-sensitive) or installed-state tracking
# breaks. `was` marks the pre-id folder name an entry migrated from: only
# entries carrying it join old un-id'd installs by name (the update then
# lands at the new category home and removes the old one).
# `requires_protocol` names the LoRa protocol package an app runs under: the
# App Library shows "Needs <protocol>" until it is installed and, on Install,
# asks to download the protocol first (never automatically). A protocol
# entry's `apps` lists its primary app ids, offered right after the protocol
# installs.
#
# Preinstalled content ships with a .version marker at these same versions;
# bumping a version here (with updated files) offers the update on-device.
#
# Optional per-entry `min_fw` (integer): the minimum firmware API level
# (_FW_API, src/version.h in the firmware repo) the entry's files need.
# Devices below it show "Needs FW" instead of Install/Update. Omit it for
# content that runs on any firmware. App Library builds older than 1.0.1
# ignore the field — until those age out, only publish gated entries when
# the mismatch degrades gracefully. NEVER put min_fw on App_Library itself:
# that update is what brings gating to old-firmware devices.

[meta]
version = 1
updated = "2026-09-05"

